<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan-to-BIM Takeoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none !important}
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1c2220; --muted:#5b6560; --line:#dde2df;
  --accent:#1f6f8b; --accent-soft:#e3eff3; --wall:#d9dfdb; --wall-ext:#a9b5af;
  --glass:#7fb8d4; --door:#b98a5a; --floor:#eef1ee; --warn:#b4541f;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121614; --panel:#1a201d; --ink:#e4e9e6; --muted:#9aa5a0; --line:#2c3531;
    --accent:#5fb3d0; --accent-soft:#1d3139; --wall:#b9c2bd; --wall-ext:#7f8c86;
    --floor:#262d2a; --warn:#e38a58;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121614; --panel:#1a201d; --ink:#e4e9e6; --muted:#9aa5a0; --line:#2c3531;
  --accent:#5fb3d0; --accent-soft:#1d3139; --wall:#b9c2bd; --wall-ext:#7f8c86;
  --floor:#262d2a; --warn:#e38a58;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);padding:20px 24px 40px}
.wrap{max-width:1840px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.picker{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lbl{font:12.5px var(--mono);color:var(--muted)}
#result{display:flex;flex-direction:column;gap:16px}
h1{font:700 clamp(24px,3.4vw,34px)/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.note{font-size:12.5px;color:var(--warn);max-width:80ch;margin:0}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.trio>*,.duo>*{min-width:0}
.range{overflow-wrap:anywhere}
.trio.solo{grid-template-columns:1fr}
@media (max-width:1100px){.trio{grid-template-columns:1fr 1fr}.trio .stage{grid-column:1/-1}.stage .frame{aspect-ratio:16/9}}
@media (max-width:700px){.trio{grid-template-columns:1fr}}
.panel{margin:0;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.panel .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;min-height:28px}
.ctrls{display:flex;flex-wrap:wrap;gap:6px}
.frame{position:relative;aspect-ratio:5/4;border:1px solid var(--line);border-radius:4px;background:#fff;overflow:hidden}
.frame img{display:block;width:100%;height:100%;object-fit:contain}
.seg.small button{font-size:11.5px;padding:4px 9px}
.range{padding:10px 14px;border-radius:8px;border:1px solid var(--line);font-size:13.5px;background:var(--panel)}
.range b{font-weight:600}
.range.low{border-color:#3d8c5a;background:color-mix(in srgb,#3d8c5a 10%,var(--panel))}
.range.medium{border-color:#c28a1e;background:color-mix(in srgb,#c28a1e 12%,var(--panel))}
.range.high{border-color:#b4541f;background:color-mix(in srgb,#b4541f 12%,var(--panel))}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
@media (max-width:860px){.duo{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
#view{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.labels span{position:absolute;transform:translate(-50%,-50%);font:500 11px/1.2 var(--sans);color:var(--ink);
  background:color-mix(in srgb,var(--panel) 82%,transparent);padding:2px 6px;border-radius:4px;white-space:nowrap;text-align:center}
.labels span b{display:block;font:500 10.5px/1.2 var(--mono);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:500 12.5px var(--sans);background:transparent;color:var(--ink);border:0;padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hint{position:absolute;right:8px;bottom:6px;font-size:11.5px;color:var(--muted);pointer-events:none}
.sect{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow-x:auto}
.sect h2 .src{text-align:right}
h2{font:600 13px/1.2 var(--sans);margin:0;letter-spacing:.02em}
.sect h2{min-height:28px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.src{font:400 11.5px var(--sans);color:var(--muted);letter-spacing:0}
td.x{color:var(--muted);font:12px var(--mono);text-align:right;white-space:nowrap;padding-left:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:13px}
td.u{color:var(--muted);font:12px var(--mono);padding-left:6px;width:3.5em}
tr.group td{padding-top:10px;font-weight:600;border-bottom:0;font-size:12px;color:var(--muted)}
tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:600;padding-top:8px}
.upload{font:500 12.5px var(--sans);border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer}
.upload:hover{filter:brightness(1.08)}
.upload input{display:none}
.empty{padding:28px 20px;color:var(--muted);font-size:14px;text-align:center}
.empty p{margin:0}
.empty code{font:12.5px var(--mono)}
</style>

<div class="wrap">
  <header>
    <h1>Plan-to-BIM Takeoff</h1>
    <div class="picker">
      <span class="lbl" id="planName"></span>
      <label class="upload" id="uploadBox"><input type="file" id="upload" accept="image/png,image/jpeg"><span id="uploadTxt">Upload a floor plan image</span></label>
    </div>
  </header>

  <div class="card empty" id="empty"><p id="emptyTxt">Upload a floor plan image to start.</p></div>

  <div id="result" hidden>
  <div class="range" id="range" role="status" hidden></div>

  <div class="trio" id="trio">
    <figure class="card panel" id="pIn">
      <div class="head"><h2>Plan image</h2></div>
      <div class="frame"><img id="imIn" alt="Floor plan image"></div>
    </figure>
    <figure class="card panel" id="pRec">
      <div class="head"><h2>Recognition</h2>
        <div class="seg small" id="recSeg" role="group" aria-label="Recognition view">
          <button data-k="seg" aria-pressed="true">Pixels</button><button data-k="elements" aria-pressed="false">Elements</button><button data-k="gt" aria-pressed="false" id="btnGt">Ground truth</button>
        </div>
      </div>
      <div class="frame"><img id="imRec" alt="What the model recognised"></div>
    </figure>
    <figure class="card panel stage">
      <div class="head"><h2>3D model</h2>
        <div class="ctrls">
          <div class="seg small" role="group" aria-label="Camera">
            <button id="cam3d" aria-pressed="true">3D</button><button id="camTop" aria-pressed="false">Top</button>
          </div>
          <div class="seg small" role="group" aria-label="Wall height">
            <button id="wFull" aria-pressed="true">Full</button><button id="wCut" aria-pressed="false">Cutaway</button>
          </div>
        </div>
      </div>
      <div class="frame">
        <canvas id="view" aria-label="3D model of the uploaded floor plan"></canvas>
        <div class="labels" id="labels"></div>
        <span class="hint">Drag to orbit · scroll to zoom</span>
      </div>
    </figure>
  </div>

  <div class="duo">
    <div class="card sect">
      <h2>Quantity takeoff</h2>
      <table id="qto"></table>
    </div>
    <div class="card sect">
      <h2>Cost <span class="src" id="rateSrc"></span></h2>
      <table id="cost"></table>
    </div>
  </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
const fmt = (v, d=1) => Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let plan = null;

// ---------- upload: each new plan replaces the previous one
$('upload').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('uploadTxt').textContent = 'Processing ' + f.name + '…';
  const fd = new FormData(); fd.append('file', f);
  try {
    const r = await fetch('/api/plan', {method:'POST', body:fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    plan = d; $('planName').textContent = f.name;
    $('empty').hidden = true; $('result').hidden = false; renderPlan();
  } catch (err) {
    plan = null; $('planName').textContent = '';
    $('result').hidden = true; $('empty').hidden = false;
    $('emptyTxt').textContent = 'Could not process ' + f.name + ': ' + err.message;
  }
  $('uploadTxt').textContent = 'Upload a floor plan image';
  e.target.value = '';
});

// ---------- plan image | recognition views
let recKind = 'seg';
function renderImages(){
  const im = plan.images;
  $('pIn').hidden = $('pRec').hidden = !im;
  $('trio').classList.toggle('solo', !im);
  if (!im) return;
  if (!im[recKind]) recKind = 'seg';
  $('btnGt').hidden = !im.gt;
  [...$('recSeg').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.k === recKind));
  $('imIn').src = im.input;
  $('imRec').src = im[recKind];
}
$('recSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ recKind = b.dataset.k; renderImages(); } });

// ---------- cost range (RQ4 interval model)
function renderRange(){
  const r = plan.cost_range, el = $('range');
  el.hidden = !(r && r.low_pct != null);
  if (el.hidden) return;
  const pct = v => (v >= 0 ? '+' : '−') + Math.abs(Math.round(v)) + '%';
  el.className = 'range ' + (r.aace_class == null ? 'high' : r.aace_class <= 3 ? 'low' : 'medium');
  el.innerHTML = `<b>Cost at exact quantities (${r.coverage_pct}% range): ${fmt(r.cost_low,0)} – ${fmt(r.cost_high,0)} USD</b> ` +
    `(${pct(r.low_pct)} / ${pct(r.high_pct)}) · ` +
    (r.aace_class == null ? 'wider than AACE Class 5' : `AACE Class ${r.aace_class}`);
}

function renderTables(){
  const Q = plan.quantities, C = plan.cost;
  const rows = [
    ['Exterior walls'], ['Length', Q.ext_wall_length_m, 'm'], ['Net face area', Q.ext_wall_net_area_m2, 'm²'],
    ['Interior partitions'], ['Length', Q.int_wall_length_m, 'm'], ['Net face area', Q.int_wall_net_area_m2, 'm²'],
    ['Openings'], ['Entrance doors', Q.doors_entry, 'ea', 0], ['Interior doors', Q.doors_interior, 'ea', 0], ['Windows', Q.windows, 'ea', 0], ['Window area', Q.window_area_m2, 'm²'],
    ['Floors'], ['Net floor area', Q.floor_area_m2, 'm²'],
  ];
  $('qto').innerHTML = `<tr><th>Item</th><th class="n">Quantity</th><th></th></tr>` + rows.map(r => r.length === 1 ? `<tr class="group"><td colspan="3">${r[0]}</td></tr>`
    : `<tr><td>${r[0]}</td><td class="n">${r[1] == null ? '–' : fmt(r[1], r[3] ?? 1)}</td><td class="u">${r[2]}</td></tr>`).join('');
  const R = plan.unit_rates || {};
  $('rateSrc').textContent = plan.unit_rate_source ? 'unit rates: ' + plan.unit_rate_source : '';
  $('cost').innerHTML = `<tr><th>Item</th><th class="n">Quantity</th><th class="n">Unit rate (USD)</th><th class="n">USD</th></tr>` +
    COST_ITEMS.map(([label, q, u, rk, ck]) => `<tr><td>${label}</td>` +
      `<td class="x">${fmt(Q[q], u === 'ea' ? 0 : 1)} ${u}</td>` +
      `<td class="x">× ${R[rk] == null ? '–' : fmt(R[rk], u === 'ea' ? 0 : 1)} /${u}</td>` +
      `<td class="n">${fmt(C[ck], 0)}</td></tr>`).join('') +
    `<tr class="total"><td colspan="3">Total (partial scope)</td><td class="n">${fmt(C.TOTAL, 0)}</td></tr>`;
  renderImages();
}

// ---------- cost = quantity x unit rate (unit rates fixed in config.py)
const COST_ITEMS = [  // [label, quantity key, unit, rate key, cost key]
  ['Exterior walls', 'ext_wall_net_area_m2', 'm²', 'ext_wall_m2', 'Exterior walls (net face)'],
  ['Interior partitions', 'int_wall_net_area_m2', 'm²', 'int_wall_m2', 'Interior partitions (net face)'],
  ['Floor finish', 'floor_area_m2', 'm²', 'floor_m2', 'Floor finish'],
  ['Interior doors', 'doors_interior', 'ea', 'door_int_ea', 'Interior doors'],
  ['Entrance doors', 'doors_entry', 'ea', 'door_entry_ea', 'Entrance doors'],
  ['Windows', 'window_area_m2', 'm²', 'window_m2', 'Windows'],
];

// ---------- 3D
const canvas = $('view'), labelsEl = $('labels');
let rebuild3D = () => {};
if (window.THREE && THREE.OrbitControls) {
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
  const controls = new THREE.OrbitControls(camera, canvas); controls.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55); scene.add(sun);
  const group = new THREE.Group(); scene.add(group);
  const tint = {LivingRoom:'#e8d9b8', Kitchen:'#cfe3d4', Bedroom:'#d6dcef', Bath:'#cfe6ee', Entry:'#e6e1d8', Room:'#dfe7ee'};
  let cut = false, cx = 0, cz = 0, span = 10, labelNodes = [];
  const mat = (c, o={}) => new THREE.MeshLambertMaterial(Object.assign({color:new THREE.Color(c)}, o));
  function build(){
    group.clear();
    const D = plan, lim = cut ? 1.2 : D.H;
    const pts = D.boxes.map(b => [b[0], b[1]]).concat(D.rooms.flatMap(r => r.pts));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    cx = (x0 + x1) / 2; cz = (y0 + y1) / 2; span = Math.max(x1 - x0, y1 - y0);
    const M = {wall: mat(css('--wall')), ext: mat(css('--wall-ext')), glass: mat(css('--glass'), {transparent:true, opacity:.45}), door: mat(css('--door'))};
    for (const r of D.rooms){
      const g = new THREE.ShapeGeometry(new THREE.Shape(r.pts.map(p => new THREE.Vector2(p[0], p[1])))); g.rotateX(Math.PI/2);
      const m = new THREE.Mesh(g, mat(tint[r.type] || css('--floor'), {side:THREE.DoubleSide})); m.position.y = .005; group.add(m);
    }
    for (const [x,y,z0,len,t,h,ang,ext] of D.boxes){
      const top = Math.min(z0+h, lim); if (top <= z0 + 1e-3) continue;
      const m = new THREE.Mesh(new THREE.BoxGeometry(len, top-z0, t), ext ? M.ext : M.wall);
      m.position.set(x, z0 + (top-z0)/2, y); m.rotation.y = -ang; group.add(m);
    }
    for (const [kind,x,y,z0,w,h,ang] of D.panels){
      const top = Math.min(z0+h, lim); if (top <= z0 + 1e-3) continue;
      if (kind === 'Door'){
        const leaf = new THREE.Mesh(new THREE.BoxGeometry(w*.96, top-z0, .04), M.door);
        const piv = new THREE.Group(); piv.position.set(x, 0, y); piv.rotation.y = -ang;
        leaf.position.set(-w/2 + w*.48*Math.cos(1.22), z0 + (top-z0)/2, w*.48*Math.sin(1.22)); leaf.rotation.y = -1.22;
        piv.add(leaf); group.add(piv);
      } else {
        const g = new THREE.Mesh(new THREE.BoxGeometry(w, top-z0, .03), M.glass);
        g.position.set(x, z0 + (top-z0)/2, y); g.rotation.y = -ang; group.add(g);
      }
    }
    labelsEl.innerHTML = D.rooms.filter(r => r.area >= 3).map(r => `<span data-c="${r.c}">${r.type && r.type !== 'Room' ? r.type.replace('LivingRoom','Living room') + ' ' : ''}${r.area.toFixed(1)} m²</span>`).join('');
    labelNodes = [...labelsEl.children].map(n => [n, n.dataset.c.split(',').map(Number)]);
  }
  function setCam(mode){
    controls.target.set(cx, .8, cz);
    if (mode === 'top') camera.position.set(cx, span * 1.7, cz + .001);
    else camera.position.set(cx - span * .7, span * 1.1, cz + span * 1.3);
    sun.position.set(cx - 6, 12, cz + 9); controls.update();
    $('cam3d').setAttribute('aria-pressed', mode !== 'top'); $('camTop').setAttribute('aria-pressed', mode === 'top');
  }
  rebuild3D = () => { build(); setCam('3d'); };
  $('cam3d').onclick = () => setCam('3d'); $('camTop').onclick = () => setCam('top');
  const setCut = v => { cut = v; build(); $('wFull').setAttribute('aria-pressed', !v); $('wCut').setAttribute('aria-pressed', v); };
  $('wFull').onclick = () => setCut(false); $('wCut').onclick = () => setCut(true);
  const v = new THREE.Vector3();
  (function frame(){
    const w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio();
    if (canvas.width !== Math.round(w*pr) || canvas.height !== Math.round(h*pr)){ renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
    controls.update(); renderer.render(scene, camera);
    for (const [n, c] of labelNodes){ v.set(c[0], .05, c[1]).project(camera); n.style.left = ((v.x+1)/2*w)+'px'; n.style.top = ((1-v.y)/2*h)+'px'; }
    requestAnimationFrame(frame);
  })();
  const retheme = () => { if (plan) build(); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
} else {
  labelsEl.innerHTML = '<span style="left:50%;top:50%">The 3D library did not load. The tables still show the takeoff.</span>';
}

function renderPlan(){ renderTables(); renderRange(); rebuild3D(); }
</script>
